<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Ton voyage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 20px;
      color: #111;
    }

    .hidden { display: none; }

    h1, h2, h3 { margin-bottom: 10px; }

    .section {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      color: #111;
    }

    /* Fix brutal si ton style.css force du blanc */
    .section, .section * { color: #111 !important; }

    .choices label {
      display: block;
      margin-bottom: 6px;
    }

    input[type="checkbox"] { accent-color: #111; }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      background: #111;
      color: white !important; /* on veut que le texte du bouton reste blanc */
      width: 100%;
      max-width: 520px;
      display: block;
      margin: 0 auto;
    }

    .loader {
      font-size: 18px;
      animation: fade 1.5s infinite;
    }

    @keyframes fade {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }
  </style>
</head>

<body class="light">

  <!-- INTRO / MESSAGE -->
  <div id="intro" class="section"></div>

  <!-- QUESTIONS -->
  <div id="questions" class="section hidden">
    <h2>On construit ton voyage</h2>

    <!-- ACTIVITÉS -->
    <h3>Ce qui te fait envie</h3>
    <p id="activitiesCounter" style="margin: 6px 0 10px; opacity: 0.8;"></p>
    <p id="activitiesHint" style="margin: 0 0 14px; color: #b00020; font-weight: 600;"></p>
    <div id="activities" class="choices"></div>

    <br>
    <button id="validateBtn">Valider mes réponses</button>
  </div>

  <!-- LOADING -->
  <div id="loading" class="section hidden">
    <p class="loader">Je combine tes choix…</p>
    <p class="loader">J’ajuste le confort…</p>
    <p class="loader">Je règle l’intensité…</p>
    <p class="loader">Je prépare ton voyage…</p>
  </div>

  <!-- RESULT -->
  <div id="result" class="section hidden"></div>

  <!-- DATA -->
  <script src="dataVoyage.js"></script>

  <script>
    /***********************
     * OUTILS
     ***********************/
    function getMaxActivitiesByDuration(n) {
      if (n <= 3) return 2;
      if (n <= 5) return 3;
      if (n <= 8) return 4;
      if (n <= 12) return 5;
      return 6;
    }

    function getMode(intensity, comfort) {
      if (intensity <= 2 && comfort === 3) return "chill_premium";
      if (intensity <= 2 && comfort <= 2) return "chill_roots";
      if (intensity >= 3 && comfort === 3) return "adventure_comfort";
      return "adventure_pure";
    }

    /***********************
     * PARAMÈTRES (depuis index.html via localStorage)
     ***********************/
    const controle  = localStorage.getItem("controle") || "C"; // A B C D E
    const duree     = Number(localStorage.getItem("duree") || 6);
    const intensity = Number(localStorage.getItem("intensity") || 2); // 1..4
    const comfort   = Number(localStorage.getItem("comfort") || 2);   // 1..3
    const startDate = "11 septembre";

    /***********************
     * INTRO
     ***********************/
    const intro = document.getElementById("intro");
    const questions = document.getElementById("questions");

    function computeTripEndDayFromPaidDays(d) {
  // Hypothèse fixe : départ vendredi 11/09/2026 soir.
  // Jours posés = jours ouvrés (lun..ven) à partir de lundi 14/09/2026.
  const firstWorkMonday = 14; // septembre 2026
  const d0 = d - 1;

  const week = Math.floor(d0 / 5); // semaines de travail complètes
  const pos = d0 % 5;              // 0..4 (lun..ven)

  const lastPaidDay = firstWorkMonday + week * 7 + pos; // date (septembre)

  // Si dernier jour posé = vendredi, on ajoute week-end bonus (sam+dim)
  const endDay = (pos === 4) ? (lastPaidDay + 2) : lastPaidDay;

  return endDay;
}

function computeEndDate() {
  const endDay = computeTripEndDayFromPaidDays(duree);
  return `du 11 septembre au ${endDay} septembre`;
}


    if (controle === "A") {
      intro.innerHTML = `
        <h1>✨ Surprise ✨</h1>
        <p>Voyage ${computeEndDate()}.</p>
        <p>Je te garde 100% de surprise… mais tu auras quelques indices d’ici là 😉</p>
      `;
    } else if (controle === "B") {
      intro.innerHTML = `
        <h1>💛 Confiance</h1>
        <p>Je te prépare un séjour fantastique de ${duree} jours à partir du ${startDate}.</p>
      `;
    } else {
      intro.innerHTML = `
        <h1>On construit ton voyage</h1>
        <p>Un séjour de ${duree} jours à partir du ${startDate}.</p>
      `;
      questions.classList.remove("hidden");
    }

    /***********************
     * ACTIVITÉS (checkbox)
     ***********************/
    const activitiesDiv = document.getElementById("activities");

    if (!window.DATA_VOYAGE || !DATA_VOYAGE.activities) {
      activitiesDiv.innerHTML = "<p>Erreur : dataVoyage.js n'est pas chargé.</p>";
      console.error("DATA_VOYAGE introuvable. Vérifie dataVoyage.js et son chemin.");
    } else {
      DATA_VOYAGE.activities.forEach(act => {
        const el = document.createElement("label");
        el.innerHTML = `
          <input type="checkbox" value="${act.id}">
          ${act.label}
        `;
        activitiesDiv.appendChild(el);
      });
    }

    /***********************
     * LIMITES DYNAMIQUES
     ***********************/
    const maxActivities = getMaxActivitiesByDuration(duree);
    const counterEl = document.getElementById("activitiesCounter");
    const hintEl = document.getElementById("activitiesHint");

    function updateActivitiesUI() {
      const checked = document.querySelectorAll("#activities input:checked").length;
      counterEl.textContent = `Activités sélectionnées : ${checked}/${maxActivities}`;
      hintEl.textContent = "";
    }
    updateActivitiesUI();

    activitiesDiv.addEventListener("change", (e) => {
      const target = e.target;
      if (!(target instanceof HTMLInputElement)) return;
      if (target.type !== "checkbox") return;

      const checkedNow = document.querySelectorAll("#activities input:checked").length;

      if (target.checked && checkedNow > maxActivities) {
        target.checked = false;
        hintEl.textContent = `Tu peux choisir au maximum ${maxActivities} activités pour ${duree} jours 🙂`;
      }

      updateActivitiesUI();
    });

    /***********************
     * VALIDATION
     ***********************/
    document.getElementById("validateBtn")?.addEventListener("click", () => {

      const selectedActivities = [...document.querySelectorAll("#activities input:checked")]
        .map(cb => cb.value);

      if (controle !== "A" && controle !== "B" && selectedActivities.length === 0) {
        alert("Choisis au moins une activité 🙂");
        return;
      }

      const mode = getMode(intensity, comfort);

      questions.classList.add("hidden");
      document.getElementById("loading").classList.remove("hidden");

      setTimeout(() => {
        showResult(selectedActivities, mode);
      }, 5500);
    });

    /***********************
     * RÉSULTAT
     ***********************/
    function showResult(activityIds, mode) {
      document.getElementById("loading").classList.add("hidden");

      const result = document.getElementById("result");
      result.classList.remove("hidden");

      let html = `
        <h2>Ton voyage</h2>
        <p><strong>${computeEndDate()}</strong> (${duree} jours)</p>
        <ul>
      `;

      const phrases = [];

      activityIds.forEach(id => {
        const act = DATA_VOYAGE.activities.find(a => a.id === id);
        if (act && act.phrases && act.phrases[mode]) {
          phrases.push(act.phrases[mode]);
        }
      });

      const max = duree <= 4 ? 3 : duree <= 7 ? 4 : 6;

      phrases.slice(0, max).forEach(p => {
        html += `<li>${p}</li>`;
      });

      html += "</ul>";

      result.innerHTML = html;
    }
  </script>

</body>
</html>
