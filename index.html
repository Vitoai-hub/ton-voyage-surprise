<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ton voyage surprise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Ton voyage surprise</h1>

  <div class="grid">

    <div class="card">
      <h2>🎛️ Contrôle</h2>
      <select id="controle">
        <option value="">Choisir…</option>
        <option value="1">Je décide</option>
        <option value="2">Je choisis beaucoup</option>
        <option value="3">On décide ensemble</option>
        <option value="4">Je te fais confiance</option>
        <option value="5">100 % surprise</option>
      </select>
    </div>

    <div class="card">
      <h2>🕒 Durée (jours posés)</h2>
      <select id="duree">
        <option value="">Choisir…</option>
        <option value="1">1 jour</option>
        <option value="3">3 jours</option>
        <option value="5">5 jours</option>
        <option value="7">7 jours</option>
        <option value="10">10 jours</option>
      </select>
    </div>

    <div class="card">
      <h2>🧭 Aventure & intensité</h2>
      <select id="aventure">
        <option value="">Choisir…</option>
        <option value="1">Douce</option>
        <option value="2">Active</option>
        <option value="3">Engagée</option>
        <option value="4">Marquante</option>
      </select>
    </div>

    <div class="card">
      <h2>🛏️ Confort</h2>
      <select id="confort">
        <option value="">Choisir…</option>
        <option value="1">Essentiel</option>
        <option value="2">Équilibré</option>
        <option value="3">Soigné</option>
      </select>
    </div>

  </div>

  <button onclick="fabrication()">Fabrication du voyage</button>

  <script src="script.js"></script>
</body>
</html>
