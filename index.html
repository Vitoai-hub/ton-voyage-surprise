<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ton voyage surprise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Ton voyage surprise</h1>
<div class="footer-note">
  Choisis ce qui te ressemble aujourd’hui. Ensuite… clique sur <b>Fabrication du voyage</b>.
</div>

  <div class="grid">

    <div class="card">
      <h2>🎛️ Contrôle</h2>
      <select id="controle">
        <option value="">—</option>
        <option value="1">A</option>
        <option value="2">B</option>
        <option value="3">C</option>
        <option value="4">D</option>
        <option value="5">E</option>
      </select>

    </div>

    <div class="card">
      <h2>🕒 Durée (jours posés)</h2>
      <select id="duree">
        <option value="">Choisir…</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
      </select>
    </div>

    <div class="card">
      <h2>🧭 Aventure & intensité</h2>
      <select id="aventure">
        <option value="">Choisir…</option>
        <option value="1">I</option>
        <option value="2">II</option>
        <option value="3">III</option>
        <option value="4">IV</option>
      </select>
    </div>

    <div class="card">
      <h2>🛏️ Confort</h2>
      <select id="confort">
        <option value="">Choisir…</option>
        <option value="1">A</option>
        <option value="2">B</option>
        <option value="3">C</option>
      </select>
    </div>

  </div>

  <button onclick="fabrication()">Fabrication du voyage</button>

  <script src="script.js"></script>
</body>
</html>
